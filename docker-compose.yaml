# Docker Compose for BarCodes
version: '3.1'

services:
  java-barcodes-service:
    image: tdchien1982/go:barcodes-1.0
    container_name: barcodes-server
    labels:
      name: "barcodes-server"
    restart: always
    environment:
      WORKING_PORT: 9092
    ports:
      - "9092:9092"
    networks:
      - common-network
networks:
  common-network:
    external: true
